[project]
name = "hn-briefing-swarm"
version = "0.1.0"
description = "A swarm of five HollowHost AI Jobs that brief a Slack channel on Hacker News throughout the day."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.40.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Only the shared package is installed; each agent is a script run by its entry point.
packages = ["swarm_core"]
